services:
  postgres:
    image: postgres:17
    container_name: makabl-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: makabl
      POSTGRES_DB: makabl
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d makabl"]
      interval: 2s
      timeout: 3s
      retries: 30
